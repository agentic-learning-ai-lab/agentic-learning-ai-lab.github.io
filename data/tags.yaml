# Paper tag vocabulary — controlled list.
#
# Adding a new tag: PR against this file. `papers.yaml` may reference
# only slugs that appear here. `build/lint_tags.js` (Phase 3) will
# enforce that automatically; until then PR review is the check.
#
# Fields:
#   slug          — kebab-case; drives /tags/<slug>/ URL. Forever.
#   label         — human display name.
#   description   — short noun phrase, shown on the tag page + og:description.
#   monogram      — 1–2 letters shown in the home-card badge.
#   cluster       — grouping for color-coding in Phase 2.
#                   values: learning-paradigms | content-and-applications | special
#   featured      — true → surfaces on the home page card grid (9 total).
#                   false → still gets a listing page + chip appearance
#                   on paper cards, just no home-page real estate.
#   related       — 1–3 sibling tag slugs shown on /tags/<slug>/ as
#                   "related tags". Curated (co-occurrence over 25
#                   papers is too noisy). Optional. May be asymmetric
#                   where the reverse direction isn't a natural sibling.

